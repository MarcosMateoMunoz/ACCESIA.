# ===== Validation (error code + .establecimiento.field) =====
NotBlank.establecimiento.nombre=The name is required.
Size.establecimiento.nombre=The name must be between 2 and 100 characters long.
Duplicate.establecimiento.nombre=A venue with that name already exists.

NotBlank.establecimiento.tipo=You must select a type.
InvalidTipo.establecimiento.tipo=The selected type is not valid.

NotBlank.establecimiento.direccion=The address is required.
Size.establecimiento.direccion=The address cannot exceed 200 characters.

Size.establecimiento.descripcion=The description cannot exceed 500 characters.

NotNull.establecimiento.aforoMaximo=The maximum capacity is required.
Min.establecimiento.aforoMaximo=The maximum capacity must be at least 1.
Max.establecimiento.aforoMaximo=The maximum capacity cannot exceed 100,000.
typeMismatch.establecimiento.aforoMaximo=The maximum capacity must be a whole number.

NotNull.establecimiento.precioReferencia=The reference price is required.
DecimalMin.establecimiento.precioReferencia=The price cannot be negative.
Digits.establecimiento.precioReferencia=The price allows at most 6 integer digits and 2 decimals.
typeMismatch.establecimiento.precioReferencia=The price must be a valid number.

Min.establecimiento.edadMinima=The minimum age cannot be negative.
Max.establecimiento.edadMinima=The minimum age cannot exceed 99.
typeMismatch.establecimiento.edadMinima=The minimum age must be a whole number.
AgeRequiresConfirmed.establecimiento.exigeCuentaConfirmada=With a minimum age of 18 or more, a confirmed account is required.

NotNull.establecimiento.idPropietario=You must select an owner.
InvalidPropietario.establecimiento.idPropietario=The selected owner does not exist or is not active.
typeMismatch.establecimiento.idPropietario=The selected owner is not valid.

ImageSize.establecimiento.imagen=The image exceeds the maximum size of 2 MB.
ImageType.establecimiento.imagen=Format not allowed. Use JPG, PNG, GIF or WEBP.
