spring.application.name=accesia-webapp
server.port=8080

# --- Base de datos (valores de .env; si no existen las variables se usan estos por defecto) ---
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/ticket-logger-webapp}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}

# --- schema.sql y data.sql se ejecutan en cada arranque ---
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# --- Internacionalización ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# --- Subida de imágenes ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload-dir=${UPLOAD_DIR:uploads}

# --- Thymeleaf ---
spring.thymeleaf.cache=false
