# ===== Validaciones (código del error + .establecimiento.campo) =====
NotBlank.establecimiento.nombre=El nombre es obligatorio.
Size.establecimiento.nombre=El nombre debe tener entre 2 y 100 caracteres.
Duplicate.establecimiento.nombre=Ya existe un establecimiento con ese nombre.

NotBlank.establecimiento.tipo=Debes seleccionar un tipo.
InvalidTipo.establecimiento.tipo=El tipo seleccionado no es válido.

NotBlank.establecimiento.direccion=La dirección es obligatoria.
Size.establecimiento.direccion=La dirección no puede superar los 200 caracteres.

Size.establecimiento.descripcion=La descripción no puede superar los 500 caracteres.

NotNull.establecimiento.aforoMaximo=El aforo máximo es obligatorio.
Min.establecimiento.aforoMaximo=El aforo máximo debe ser al menos 1.
Max.establecimiento.aforoMaximo=El aforo máximo no puede superar 100.000.
typeMismatch.establecimiento.aforoMaximo=El aforo máximo debe ser un número entero.

NotNull.establecimiento.precioReferencia=El precio de referencia es obligatorio.
DecimalMin.establecimiento.precioReferencia=El precio no puede ser negativo.
Digits.establecimiento.precioReferencia=El precio admite como máximo 6 enteros y 2 decimales.
typeMismatch.establecimiento.precioReferencia=El precio debe ser un número válido.

Min.establecimiento.edadMinima=La edad mínima no puede ser negativa.
Max.establecimiento.edadMinima=La edad mínima no puede superar 99.
typeMismatch.establecimiento.edadMinima=La edad mínima debe ser un número entero.
AgeRequiresConfirmed.establecimiento.exigeCuentaConfirmada=Con edad mínima de 18 o más es obligatorio exigir cuenta confirmada.

NotNull.establecimiento.idPropietario=Debes seleccionar un propietario.
InvalidPropietario.establecimiento.idPropietario=El propietario seleccionado no existe o no está activo.
typeMismatch.establecimiento.idPropietario=El propietario seleccionado no es válido.

ImageSize.establecimiento.imagen=La imagen supera el tamaño máximo de 2 MB.
ImageType.establecimiento.imagen=Formato no permitido. Usa JPG, PNG, GIF o WEBP.
